plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thor.audiounlocker'
    compileSdk 34

    defaultConfig {
        applicationId "com.thor.audiounlocker"
        minSdk 28
        targetSdk 34
        versionCode 3
        versionName "3.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero external dependencies for minimal APK size (~90 KB) and near-zero RAM overhead.
dependencies {
}
